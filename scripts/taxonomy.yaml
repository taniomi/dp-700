# DP-700 skill taxonomy, sourced from the official study guide (fetched 2026-10-13,
# "Skills measured as of October 19, 2026"):
# https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700
#
# Domains and subareas MUST stay in the study guide's order: official objective codes
# like "2.3" are mapped by position. weight_pct is the midpoint of the published range.
# Keywords are case-insensitive regexes matched against a question's linked doc
# title(s), then its text. The first match in file order wins, so keep early
# subareas' keywords specific (e.g. "eventstream" in 2.3 would otherwise also
# claim "Troubleshoot Eventstream errors" questions that belong in 3.2). Product
# keywords in domain 2 that also have a 3.2 "resolve X errors" objective carry a
# ^(?!.*(error|troubleshoot)) guard so error questions fall through to 3.2.
# Extend these lists as NEEDS REVIEW questions turn up -- this file is the thing
# to edit, not the parser.

